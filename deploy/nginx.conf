# /etc/nginx/sites-available/photoshare
# Presentation tier: serves the React build.
# Reverse proxy: forwards /api/* to the Flask app (application tier) on port 5000.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 12M;   # must be larger than MAX_UPLOAD_MB in backend .env

    root /opt/photoshare/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React Router: unknown paths return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
